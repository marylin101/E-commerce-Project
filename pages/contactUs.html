<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="contact-page-container">
    <section class="contact-form-card">
        <div class="card-tag">Get in Touch</div>
        <h1 class="card-title">Send Us a Message</h1>
        <p class="card-subtitle">Have a question about an order, delivery, or custom stationery? Drop us a note below.</p>

        <form class="contact-form" action="#" method="POST" onsubmit="event.preventDefault()">
        <div class="form-row">
            <div class="form-field">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Alex Morgan" required />
            </div>

            <div class="form-field">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required />
            </div>
        </div>

        <div class="form-field">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Order inquiry, backorder request, etc." required />
        </div>

        <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </section>

    <section class="direct-channels-card">
        <div class="channel-list">
        
        <a href="tel:+27123456789" class="channel-item">
            <div class="channel-icon-box call">
            <img src="../assets/call.png" alt="Call icon" class="icon" />
            </div>
            <div class="channel-info">
            <h3>Direct Call</h3>
            <p>+27 (0) 12 345 6789 <span class="hours">• Mon – Fri, 08:30 to 17:00</span></p>
            </div>
        </a>

        <div class="channel-divider"></div>

        <a href="https://wa.me/27123456789" target="_blank" rel="noopener noreferrer" class="channel-item">
            <div class="channel-icon-box whatsapp">
            <img src="../assets/whaasapp.png" alt="WhatsApp icon" class="icon" />
            </div>
            <div class="channel-info">
            <h3>WhatsApp Support</h3>
            <p>Chat directly with our team for quick tracking updates and order support.</p>
            </div>
        </a>

        </div>
    </section>

    </main>
    <div id="footer-placeholder"></div>
    <script src="../partials/script.js"></script>
</body>
</html>
